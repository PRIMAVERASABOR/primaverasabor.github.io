  <style>
:root {
  --cor-principal: #23473A;
  --cor-destaque:  #E3A72F;
  --cor-fundo:     #F2F5F1;
  --cor-texto:     #1B2B24;
  --fonte-titulo: "Bricolage Grotesque", Georgia, serif;
  --fonte-texto: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--cor-fundo);
  color: var(--cor-texto);
  font: 400 1.0625rem/1.6 var(--fonte-texto);
}

h1, h2 { font-family: var(--fonte-titulo); font-weight: 700; margin: 0; }

:focus-visible { outline: 3px solid var(--cor-destaque); outline-offset: 3px; }

[hidden] { display: none !important; }

/* ---------- Capa ---------- */
.hero {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--cor-principal);
  color: #fff;
  text-align: center;
}
.hero--foto { justify-content: flex-start; }

.hero__foto {
  width: 100%;
  height: 44svh;
  max-height: 30rem;
  background-image:
    linear-gradient(180deg, rgba(0, 0, 0, 0) 50%, var(--cor-principal) 100%),
    var(--foto, none);
  background-size: cover;
  background-position: center 30%;
}

.hero__conteudo {
  width: min(100%, 26rem);
  padding: 0 1.25rem calc(2rem + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  align-items: center;
}
.hero--foto .hero__conteudo { position: relative; margin-top: -2.5rem; }
.hero:not(.hero--foto) .hero__conteudo { padding-top: calc(2rem + env(safe-area-inset-top)); }

.logo {
  width: 6rem;
  height: 6rem;
  border-radius: 50%;
  border: 2px solid var(--cor-destaque);
  overflow: hidden;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, .08);
}
.logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.logo--monograma {
  font-family: var(--fonte-titulo);
  font-size: 2.25rem;
  font-weight: 700;
  color: var(--cor-destaque);
}
.logo--imagem {
  width: min(100%, 15rem);
  height: auto;
  border: 0;
  border-radius: 1rem;
  padding: .625rem .75rem;
  background: #fff;
}
.logo--imagem img { width: 100%; height: auto; object-fit: contain; }

.hero h1 {
  margin-top: 1.5rem;
  font-size: clamp(2.5rem, 11vw, 3.75rem);
  line-height: 1.02;
  letter-spacing: -.02em;
}

.slogan {
  margin: 1rem 0 0;
  font-size: 1.125rem;
  opacity: .92;
  max-width: 22rem;
}

/* telas grandes: a foto fica numa coluna central, sem esticar */
@media (min-width: 700px) {
  .hero__foto {
    max-width: 34rem;
    height: 38rem;
    max-height: none;
    background-position: center 22%;
  }
}

/* texto só para leitores de tela e buscadores */
.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Botões ---------- */
.acoes {
  width: 100%;
  margin-top: 2.25rem;
  display: grid;
  gap: .875rem;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 3.625rem;
  padding: 0 1.5rem;
  border-radius: 999px;
  border: 2px solid transparent;
  font: 700 1.0625rem/1 var(--fonte-texto);
  text-decoration: none;
  transition: transform .12s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: scale(.97); }

.btn--principal { background: var(--cor-destaque); color: #1B1405; }
.btn--branco    { background: #fff; color: var(--cor-principal); }
.btn--contorno  { border-color: rgba(255, 255, 255, .7); color: #fff; }

/* ---------- Cardápio ---------- */
.cardapio {
  width: min(100%, 40rem);
  margin: 0 auto;
  padding: 3.5rem 1.25rem 1rem;
}
.cardapio h2 {
  font-size: clamp(1.75rem, 6vw, 2.25rem);
  color: var(--cor-principal);
}
.cardapio__aviso {
  margin: .5rem 0 0;
  font-size: .9rem;
  color: color-mix(in srgb, var(--cor-texto) 70%, transparent);
}

.categorias {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  gap: .5rem;
  overflow-x: auto;
  margin: 1rem -1.25rem 0;
  padding: calc(.75rem + env(safe-area-inset-top)) 1.25rem .75rem;
  background: var(--cor-fundo);
  scrollbar-width: none;
}
.categorias::-webkit-scrollbar { display: none; }

.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  min-height: 2.75rem;
  padding: 0 1.125rem;
  border: 2px solid var(--cor-principal);
  border-radius: 999px;
  color: var(--cor-principal);
  font-weight: 700;
  font-size: .95rem;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.chip:active { background: var(--cor-principal); color: #fff; }

.categoria { scroll-margin-top: 5rem; padding-top: 1.5rem; }
.categoria h3 {
  font-family: var(--fonte-titulo);
  font-size: 1.5rem;
  color: var(--cor-principal);
  margin: 0 0 .5rem;
}

.item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 1rem;
  padding: 1.125rem 0;
  border-top: 1px solid color-mix(in srgb, var(--cor-texto) 18%, transparent);
}
.item__texto { min-width: 0; }
.item h4 { margin: 0; font-size: 1.0625rem; font-weight: 700; }
.item__desc {
  margin: .25rem 0 0;
  font-size: .95rem;
  color: color-mix(in srgb, var(--cor-texto) 72%, transparent);
}
.item__rodape {
  margin-top: .75rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
}
.item__preco { font-weight: 700; color: var(--cor-principal); }

.pedir {
  display: inline-flex;
  align-items: center;
  min-height: 2.75rem;
  padding: 0 1.25rem;
  border-radius: 999px;
  background: var(--cor-destaque);
  color: #1B1405;
  font-weight: 700;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.pedir:active { transform: scale(.97); }

.item__foto {
  width: 6.5rem;
  height: 6.5rem;
  object-fit: cover;
  border-radius: .75rem;

<script>
(function () {
  "use strict";

  var c = window.CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- Aberto agora / Fechado ---------- */
  var doDia = null; /* cardápio do dia dos espetinhos, quando carregado */
  var NOMES_DIA = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
  var minutos = function (hhmm) { var p = String(hhmm || "0:0").split(":"); return (+p[0]) * 60 + (+p[1] || 0); };
  var horaTexto = function (hhmm) { var p = String(hhmm).split(":"); return (+p[0]) + "h" + (+p[1] ? p[1] : ""); };
  /* hora de Codó-MA (UTC-3, sem horário de verão), qualquer que seja o fuso do celular */
  var agoraCodo = function () {
    var d = new Date(Date.now() - 3 * 3600 * 1000);
    return { dia: d.getUTCDay(), min: d.getUTCHours() * 60 + d.getUTCMinutes(),
             data: d.toISOString().slice(0, 10), ms: d.getTime() };
  };
  var dataMais = function (ms, n) { return new Date(ms + n * 86400000).toISOString().slice(0, 10); };
  var situacao = function () {
    var f = c.funcionamento;
    if (!f || !f.dias || !f.abre || !f.fecha) return null;
    var a = minutos(f.abre), z = minutos(f.fecha), h = agoraCodo();
    var fechadoEm = f.fechadoEm || [];
    var abreNoDia = function (n) {
      var dia = (h.dia + n) % 7;
      return f.dias.indexOf(dia) > -1 && fechadoEm.indexOf(dataMais(h.ms, n)) === -1;
    };
    if (abreNoDia(0) && h.min >= a && h.min < z) {
      return { aberto: true, texto: "Aberto agora · até " + horaTexto(f.fecha) };
    }
    for (var n = 0; n <= 7; n++) {
      if (!abreNoDia(n) || (n === 0 && h.min >= a)) continue;
      var quando = n === 0 ? "hoje" : n === 1 ? "amanhã" : NOMES_DIA[(h.dia + n) % 7];
      return { aberto: false, quando: quando + " às " + horaTexto(f.abre),
               texto: "Fechado agora · abrimos " + quando + " às " + horaTexto(f.abre) };
    }
    return { aberto: false, quando: "", texto: "Fechado agora" };
  };
  var mostrarStatus = function () {
    var s = situacao(), box = $("status");
    if (!s || !box) return;
    box.hidden = false;
    box.className = "status " + (s.aberto ? "status--aberto" : "status--fechado");
    $("status-texto").textContent = s.texto;
  };
  mostrarStatus();
  setInterval(mostrarStatus, 60000);

  /* Cores */
  var raiz = document.documentElement.style;
  if (c.cores) {
    if (c.cores.principal) raiz.setProperty("--cor-principal", c.cores.principal);
    if (c.cores.destaque)  raiz.setProperty("--cor-destaque", c.cores.destaque);
    if (c.cores.fundo)     raiz.setProperty("--cor-fundo", c.cores.fundo);
    if (c.cores.texto)     raiz.setProperty("--cor-texto", c.cores.texto);
  }

  /* Foto de capa */
  if (c.fotoCapa) {
    /* endereço completo da imagem: o CSS está na pasta css/ e acharia o caminho errado */
    raiz.setProperty("--foto", 'url("' + new URL(c.fotoCapa, document.baseURI).href + '")');
    $("inicio").classList.add("hero--foto");
  } else {
    $("hero-foto").hidden = true;
  }

  /* Textos */
  $("nome").textContent = c.nome || "";
  $("slogan").textContent = c.slogan || "";
  $("descricao").textContent = c.descricao || "";
  $("rodape").textContent = "© " + new Date().getFullYear() + " " + (c.nome || "");
  document.title = (c.nome || "Restaurante") + (c.slogan ? " | " + c.slogan : "");
  /* a descrição para o Google fica fixa no index.html */

  /* Destaques */
  var lista = $("destaques");
  (c.destaques || []).forEach(function (texto) {
    var li = document.createElement("li");
    li.textContent = texto;
    lista.appendChild(li);
  });

  /* Logo: imagem ou monograma com as iniciais */
  var logo = $("logo");
  if (c.logo) {
    var img = document.createElement("img");
    img.src = c.logo;
    img.alt = "Logotipo " + (c.nome || "");
    logo.classList.add("logo--imagem");
    logo.appendChild(img);
    $("nome").classList.add("sr-only"); /* a logo já mostra o nome */
  } else {
    var ignorar = ["da", "de", "do", "das", "dos", "e"];
    var iniciais = (c.nome || "").split(/\s+/).filter(function (p) {
      return p && ignorar.indexOf(p.toLowerCase()) === -1;
    }).slice(0, 2).map(function (p) { return p.charAt(0).toUpperCase(); }).join("");
    logo.textContent = iniciais;
    logo.classList.add("logo--monograma");
    logo.setAttribute("aria-hidden", "true");
  }

  /* Botões */
  var numero = String(c.whatsapp || "").replace(/\D/g, "");
  if (numero) {
    $("btn-whatsapp").href = "https://wa.me/" + numero +
      "?text=" + encodeURIComponent(c.mensagemWhatsapp || "");
  } else {
    $("btn-whatsapp").hidden = true;
  }

  if (c.cardapio) {
    $("btn-cardapio").href = c.cardapio;
  } else {
    $("btn-cardapio").hidden = true;
  }

  var usuario = String(c.instagram || "").replace(/^@/, "").trim();
  if (usuario) {
    $("btn-instagram").href = "https://instagram.com/" + encodeURIComponent(usuario);
  } else {
    $("btn-instagram").hidden = true;
  }

  /* Endereço, horário e mapa */
  if (c.endereco || c.horario) {
    $("endereco").textContent = c.endereco || "";
    $("horario").textContent = c.horario || "";
    if (!c.endereco) $("endereco").parentNode.hidden = true;
    if (!c.horario) $("horario").parentNode.hidden = true;
    if (c.endereco) {
      var q = encodeURIComponent(c.coordenadas || c.endereco);
      var mapa = document.createElement("iframe");
      mapa.src = "https://maps.google.com/maps?q=" + q + "&z=17&output=embed";
      mapa.title = "Mapa: " + c.endereco;
      mapa.loading = "lazy";
      mapa.referrerPolicy = "no-referrer-when-downgrade";
      $("mapa").appendChild(mapa);
      $("btn-rota").href = "https://www.google.com/maps/dir/?api=1&destination=" + q;
    } else {
      $("mapa").hidden = true;
      $("btn-rota").hidden = true;
    }
  } else {
    $("local").hidden = true;
  }

  var menu = c.menu || [];
  /* ---------- Carrinho de pedidos ---------- */
  var reais = function (v) {
    return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  };
  var el = function (tag, classe, texto) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto != null) e.textContent = texto;
    return e;
  };
  var guardar = function (chave, valor) {
    try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) {}
  };
  var lembrar = function (chave, padrao) {
    try { var v = JSON.parse(localStorage.getItem(chave)); return v == null ? padrao : v; } catch (e) { return padrao; }
  };

  var cfgPizza = c.pizza || { tamanhos: [], bordas: [], massas: [] };
  var cfgEntrega = c.entrega || { bairros: [] };
  var carrinho = lembrar("ps-carrinho", []);
  if (!Array.isArray(carrinho)) carrinho = [];
  var cliente = lembrar("ps-cliente", {});

  /* Pix copia e cola com o valor do pedido */
  var pixCampo = function (id, v) { v = String(v); return id + (v.length < 10 ? "0" : "") + v.length + v; };
  var crc16 = function (s) {
    var c = 0xFFFF;
    for (var i = 0; i < s.length; i++) {
      c ^= s.charCodeAt(i) << 8;
      for (var j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF;
    }
    return ("0000" + c.toString(16).toUpperCase()).slice(-4);
  };
  var codigoPix = function (valor) {
    var p = pixCampo("00", "01") + pixCampo("01", "11") +
      pixCampo("26", pixCampo("00", "br.gov.bcb.pix") + pixCampo("01", (c.pix || {}).chave)) +
      pixCampo("52", "0000") + pixCampo("53", "986") +
      (valor ? pixCampo("54", valor.toFixed(2)) : "") +
      pixCampo("58", "BR") + pixCampo("59", (c.pix || {}).nome) + pixCampo("60", (c.pix || {}).cidade) +
      pixCampo("62", pixCampo("05", (c.pix || {}).txid || "***")) + "6304";
    return p + crc16(p);
  };
  var copiar = function (texto, botao) {
    var ok = function () { botao.textContent = "Código copiado ✓"; setTimeout(function () { botao.textContent = "Copiar código Pix"; }, 2500); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(texto).then(ok, function () { velho(); });
    } else velho();
    function velho() {
      var t = document.createElement("textarea"); t.value = texto; t.setAttribute("readonly", "");
      t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t);
      t.select(); try { document.execCommand("copy"); ok(); } catch (e) {} t.remove();
    }
  };
  /* caixa com valor, código e botão copiar */
  var caixaPix = function () {
    var box = el("div", "pix");

          pedir.target = "_blank";
          pedir.rel = "noopener";
          pedir.setAttribute("aria-label", "Pedir " + it.nome + " pelo WhatsApp");
          rodape.appendChild(pedir);
        }
        texto.appendChild(rodape);
        card.appendChild(texto);

        if (it.foto) {
          var foto = criar("img", "item__foto");
          foto.src = it.foto;
          foto.alt = it.nome;
          foto.loading = "lazy";
          foto.onerror = function () { foto.remove(); card.classList.remove("item--destaque"); };
          card.appendChild(foto);
        }
        bloco.appendChild(card);
      });

      area.appendChild(bloco);
    });

    /* Cardápio do dia dos espetinhos (planilha do Google, com reserva no arquivo) */
    var dd = c.cardapioDoDia;
    var alvo = [].slice.call(area.querySelectorAll(".categoria")).filter(function (s) {
      return /espetinho/i.test((s.querySelector("h3") || {}).textContent || "");
    })[0];
    menu.forEach(function (cat) {
      if (!/espetinho/i.test(cat.categoria || "")) return;
      (cat.itens || []).forEach(function (x) { if (!/especial/i.test(x.nome)) x.pratoDoDia = true; });
    });
    if (dd && alvo) {
      var box = criar("div", "do-dia");
      box.appendChild(criar("p", "do-dia__titulo", "Cardápio de hoje (" + NOMES_DIA[agoraCodo().dia] + ")"));
      box.appendChild(criar("p", "do-dia__sub", "Carregando o cardápio do dia…"));
      alvo.insertBefore(box, alvo.querySelector("h3").nextSibling);

      var desenhar = function (d) {
        doDia = d;
        box.innerHTML = "";
        box.appendChild(criar("p", "do-dia__titulo", "Cardápio de hoje (" + NOMES_DIA[agoraCodo().dia] + ")"));
        if (!d) {
          box.appendChild(criar("p", "do-dia__sub", "O arroz e os acompanhamentos mudam todo dia. Pergunte o cardápio de hoje pelo WhatsApp ou escreva sua preferência na observação do pedido."));
          return;
        }
        box.appendChild(criar("p", "do-dia__sub", "Espetinho servido como prato feito: você escolhe 1 arroz e leva todos os acompanhamentos."));
        var grupoChips = function (rotulo, itens) {
          if (!itens.length) return;
          box.appendChild(criar("p", "do-dia__rotulo", rotulo));
          var ul = criar("ul", "do-dia__lista");
          itens.forEach(function (a) { ul.appendChild(criar("li", null, a)); });
          box.appendChild(ul);
        };
        grupoChips("Arroz (escolha 1)", d.arroz);
        grupoChips("Acompanhamentos (vão todos)", d.acompanhamentos);
        grupoChips("Especiais do dia", d.especiais);
      };

      /* só vale se for de hoje (quando a data for preenchida) */
      var valido = function (d) {
        if (!d || !(d.arroz.length || d.acompanhamentos.length)) return null;
        if (d.data) {
          var hoje = agoraCodo().data; /* AAAA-MM-DD */
          var p = String(d.data).trim().split(/[\/\-.]/);
          var iso = p.length === 3 ? (p[0].length === 4 ? p[0] + "-" + p[1] + "-" + p[2] : p[2] + "-" + p[1] + "-" + p[0]) : "";
          iso = iso.replace(/-(\d)(?=-|$)/g, "-0$1");
          if (iso !== hoje) return null;
        }
        return d;
      };
      var lerCSV = function (txt) {
        var d = { data: "", arroz: [], acompanhamentos: [], especiais: [] };
        txt.split(/\r?\n/).forEach(function (linha) {
          var cols = [], atual = "", aspas = false;
          for (var k = 0; k < linha.length; k++) {
            var ch = linha[k];
            if (ch === '"') { if (aspas && linha[k + 1] === '"') { atual += '"'; k++; } else aspas = !aspas; }
            else if (ch === "," && !aspas) { cols.push(atual); atual = ""; }
            else atual += ch;
          }
          cols.push(atual);
          var tipo = (cols[0] || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          var item = (cols[1] || "").trim();
          if (!item) return;
          if (tipo.indexOf("data") === 0) d.data = item;
          else if (tipo.indexOf("arroz") === 0) d.arroz.push(item);
          else if (tipo.indexOf("acomp") === 0) d.acompanhamentos.push(item);
          else if (tipo.indexOf("especia") === 0) d.especiais.push(item);
        });
        return d;
      };
      var reserva = function () {
        var r = dd.reserva || {};
        return valido({ data: r.data || "", arroz: r.arroz || [], acompanhamentos: r.acompanhamentos || [], especiais: r.especiais || [] });
      };
      if (dd.planilha && window.fetch) {
        var url = dd.planilha + (dd.planilha.indexOf("?") > -1 ? "&" : "?") + "t=" + Date.now();
        fetch(url, { cache: "no-store" })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
          .then(function (txt) { desenhar(valido(lerCSV(txt)) || reserva()); })
          .catch(function () { desenhar(reserva()); });
      } else {
        desenhar(reserva());
      }
    }
  }
})();

</script>
</body>
</html>
